name: SEO Quality Gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  seo-audit:
    name: SEO Technical Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Next.js Build Cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx', '**/*.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: Build Next.js Application
        run: pnpm build

      - name: Start Application & Run SEO Audit
        run: |
          pnpm start &
          npx -y wait-on http://127.0.0.1:3000 --timeout 60000
          npx -y seo report --url http://127.0.0.1:3000 --actions-only --json > seo-report.json

      - name: Upload SEO Audit Artifact
        uses: actions/upload-artifact@v4
        with:
          name: seo-audit-report
          path: seo-report.json
          if-no-files-found: warn
