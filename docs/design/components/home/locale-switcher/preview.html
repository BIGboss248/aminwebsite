    function applyLocale(locale) {
      const html = document.documentElement;
      const isFa = (locale === 'fa');

      html.setAttribute('lang', locale);
      html.setAttribute('dir', isFa ? 'rtl' : 'ltr');

      // Update Segment Buttons
      const btnEn = document.getElementById('btnLocaleEn');
      const btnFa = document.getElementById('btnLocaleFa');
      if (btnEn && btnFa) {
        btnEn.classList.toggle('active', !isFa);
        btnEn.setAttribute('aria-checked', !isFa ? 'true' : 'false');
        btnFa.classList.toggle('active', isFa);
        btnFa.setAttribute('aria-checked', isFa ? 'true' : 'false');
      }

      // Update Copy
      const copy = i18nCopy[locale] || i18nCopy.en;
      document.getElementById('transSubtitle').textContent = copy.subtitle;
      document.getElementById('navHome').textContent = copy.navHome;
      document.getElementById('navProjects').textContent = copy.navProjects;
      document.getElementById('navLab').textContent = copy.navLab;
      document.getElementById('navAbout').textContent = copy.navAbout;
      document.getElementById('navContact').textContent = copy.navContact;
      document.getElementById('transEngineBadge').textContent = copy.engineBadge;
      document.getElementById('transHeadline').textContent = copy.headline;
      document.getElementById('transBody').textContent = copy.body;
      document.getElementById('transLblDir').textContent = copy.lblDir;
      document.getElementById('transValDir').textContent = copy.valDir;
      document.getElementById('transLblFont').textContent = copy.lblFont;
      document.getElementById('transValFont').textContent = copy.valFont;

      // Notify parent window if embedded
      if (window.parent && window.parent.onIframeStateChange) {
        window.parent.onIframeStateChange(locale, html.classList.contains('dark') ? 'dark' : 'light');
      }
    }

    // Attach click listeners to segment buttons inside iframe
    document.getElementById('btnLocaleEn').addEventListener('click', () => applyLocale('en'));
    document.getElementById('btnLocaleFa').addEventListener('click', () => applyLocale('fa'));

    // Inner theme toggle
    document.getElementById('innerThemeToggle').addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
      if (window.parent && window.parent.onIframeStateChange) {
        window.parent.onIframeStateChange(
          document.documentElement.getAttribute('lang') || 'en',
          document.documentElement.classList.contains('dark') ? 'dark' : 'light'
        );
      }
    });

    // Global hook for parent control
    window.setIframeLocale = applyLocale;
    window.setIframeTheme = (theme) => {
      document.documentElement.classList.toggle('dark', theme === 'dark');
    };

    // Initialize Iframe
    const iframe = document.getElementById('previewIframe');
    const iframeDoc = iframe.contentWindow.document;
    iframeDoc.open();
    iframeDoc.write(iframeHtml);
    iframeDoc.close();

    // Viewport Resizing Logic
    const viewportBtns = document.querySelectorAll('.viewport-btn');
    const iframeWrapper = document.getElementById('iframeWrapper');
    const activeWidthLabel = document.getElementById('activeWidthLabel');

    viewportBtns.forEach((btn) => {
      btn.addEventListener('click', () => {
        viewportBtns.forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        const targetWidth = btn.dataset.width;
        iframeWrapper.style.width = targetWidth;
        activeWidthLabel.textContent = targetWidth;
      });
    });

    // Parent Theme Toggle Control
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    const themeLabel = document.getElementById('themeLabel');
    const activeThemeIndicator = document.getElementById('activeThemeIndicator');
    let currentTheme = 'dark';

    themeToggleBtn.addEventListener('click', () => {
      currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
      document.documentElement.classList.toggle('dark', currentTheme === 'dark');
      themeLabel.textContent = currentTheme === 'dark' ? 'Dark' : 'Light';
      activeThemeIndicator.textContent = currentTheme.toUpperCase();
      if (iframe.contentWindow && iframe.contentWindow.setIframeTheme) {
        iframe.contentWindow.setIframeTheme(currentTheme);
      }
    });

    // Parent Direction / Locale Toggle Control
    const dirToggleBtn = document.getElementById('dirToggleBtn');
    const dirLabel = document.getElementById('dirLabel');
    const activeDirIndicator = document.getElementById('activeDirIndicator');
    let currentLocale = 'en';

    dirToggleBtn.addEventListener('click', () => {
      currentLocale = currentLocale === 'en' ? 'fa' : 'en';
      dirLabel.textContent = currentLocale === 'en' ? 'LTR (EN)' : 'RTL (FA)';
      activeDirIndicator.textContent = currentLocale === 'en' ? 'LTR' : 'RTL';
      if (iframe.contentWindow && iframe.contentWindow.setIframeLocale) {
        iframe.contentWindow.setIframeLocale(currentLocale);
      }
    });

    // Callback when inner iframe toggles state
    window.onIframeStateChange = (locale, theme) => {
      currentLocale = locale;
      currentTheme = theme;
      dirLabel.textContent = currentLocale === 'en' ? 'LTR (EN)' : 'RTL (FA)';
      activeDirIndicator.textContent = currentLocale === 'en' ? 'LTR' : 'RTL';
      themeLabel.textContent = currentTheme === 'dark' ? 'Dark' : 'Light';
      activeThemeIndicator.textContent = currentTheme.toUpperCase();
      document.documentElement.classList.toggle('dark', currentTheme === 'dark');
    };
  </script>
