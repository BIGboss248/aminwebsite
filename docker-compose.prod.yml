services:
  nextjs-app:
    image: ghcr.io/bigboss248/aminwebsite:${IMAGE_TAG:-latest}
    container_name: nextjs-standalone-app
    restart: always
    expose:
      - "${PORT:-3000}"
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-3000}
      - NEXT_PUBLIC_BASE_URL=${NEXT_PUBLIC_BASE_URL:-https://meetjamali.com}
      - CONTACT_RECIPIENT_EMAIL=${CONTACT_RECIPIENT_EMAIL:-contact@meetjamali.com}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-traefik-net}"
      # HTTP Router: Redirect all HTTP requests to HTTPS
      - "traefik.http.routers.nextjs-http.rule=Host(`${DOMAIN:-meetjamali.com}`) || Host(`www.${DOMAIN:-meetjamali.com}`)"
      - "traefik.http.routers.nextjs-http.entrypoints=web"
      - "traefik.http.routers.nextjs-http.middlewares=nextjs-redirect-https"
      - "traefik.http.middlewares.nextjs-redirect-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.nextjs-redirect-https.redirectscheme.permanent=true"
      # HTTPS Router: TLS Termination & Let's Encrypt Certificate
      - "traefik.http.routers.nextjs-secure.rule=Host(`${DOMAIN:-meetjamali.com}`) || Host(`www.${DOMAIN:-meetjamali.com}`)"
      - "traefik.http.routers.nextjs-secure.entrypoints=websecure"
      - "traefik.http.routers.nextjs-secure.tls=true"
      - "traefik.http.routers.nextjs-secure.tls.certresolver=${CERT_RESOLVER:-letsencrypt}"
      # Service Load Balancer Port
      - "traefik.http.services.nextjs.loadbalancer.server.port=${PORT:-3000}"
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - traefik-net
      - default
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:'' + (process.env.PORT || 3000) + ''/api/health'').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  traefik-net:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik-net}
