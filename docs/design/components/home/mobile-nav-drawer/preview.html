    iframe.srcdoc = iframeHtml;

    function setViewport(width, btn) {
      container.style.width = width;
      document.querySelectorAll('.btn-group[aria-label="Viewport Size"] .btn-control').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('viewport-indicator').textContent = 'Viewport: ' + width + (width === '375px' ? ' (Mobile)' : width === '768px' ? ' (Tablet)' : ' (Desktop)');
    }

    function toggleTheme() {
      const doc = iframe.contentDocument || iframe.contentWindow.document;
      currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
      doc.documentElement.classList.toggle('dark', currentTheme === 'dark');
      document.getElementById('theme-icon').textContent = currentTheme === 'dark' ? '☀️' : '🌙';
      document.getElementById('theme-text').textContent = currentTheme === 'dark' ? 'Light Mode' : 'Dark Mode';
      document.getElementById('theme-indicator').textContent = 'Theme: ' + (currentTheme === 'dark' ? 'Dark' : 'Light');
    }

    function setLocale(locale, btn) {
      const doc = iframe.contentDocument || iframe.contentWindow.document;
      currentLocale = locale;
      document.querySelectorAll('.btn-group[aria-label="Locale Toggle"] .btn-control').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      const isRtl = locale === 'fa';
      doc.documentElement.setAttribute('dir', isRtl ? 'rtl' : 'ltr');
      doc.documentElement.setAttribute('lang', locale);

      const navArrow = doc.getElementById('nav-arrow-home');
      if (navArrow) {
        navArrow.textContent = isRtl ? '←' : '→';
      }

      // Mutate copy
      if (isRtl) {
        doc.getElementById('sec-title').textContent = '// ساختار_مسیرها';
        doc.getElementById('lbl-home').textContent = 'صفحه نخست';
        doc.getElementById('desc-home').textContent = 'رصدخانه مرکزی سامانه‌ها';
        doc.getElementById('lbl-about').textContent = 'درباره من';
        doc.getElementById('desc-about').textContent = 'بیوگرافی و فلسفه معماری';
        doc.getElementById('lbl-projects').textContent = 'پروژه‌ها';
        doc.getElementById('desc-projects').textContent = 'مطالعات موردی مقیاس‌بالا';
        doc.getElementById('lbl-lab').textContent = 'آزمایشگاه';
        doc.getElementById('desc-lab').textContent = 'ابزارهای برخط تحلیل شبکه';
        doc.getElementById('lbl-contact').textContent = 'تماس';
        doc.getElementById('desc-contact').textContent = 'ارتباط مستقیم و مشاوره';
      } else {
        doc.getElementById('sec-title').textContent = '// ROUTE_TOPOLOGY';
        doc.getElementById('lbl-home').textContent = 'Home';
        doc.getElementById('desc-home').textContent = 'Root Systems Observatory';
        doc.getElementById('lbl-about').textContent = 'About';
        doc.getElementById('desc-about').textContent = 'Biography & Architecture Philosophy';
        doc.getElementById('lbl-projects').textContent = 'Projects';
        doc.getElementById('desc-projects').textContent = 'High-Scale Case Studies';
        doc.getElementById('lbl-lab').textContent = 'Lab Hub';
        doc.getElementById('desc-lab').textContent = 'Real-Time Network Diagnostics';
        doc.getElementById('lbl-contact').textContent = 'Contact';
        doc.getElementById('desc-contact').textContent = 'Direct Inquiry & Consulting';
      }

      document.getElementById('locale-indicator').textContent = 'Locale: ' + (isRtl ? 'Persian (RTL)' : 'English (LTR)');
    }

    function toggleIframeDrawer() {
      const win = iframe.contentWindow;
      if (win && win.toggleDrawer) {
        win.toggleDrawer();
      }
